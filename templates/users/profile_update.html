{% extends 'base.html' %}
{% block title %}Instagram Profile Update{% endblock %}
{% block content %}
<style>
    /* ... (The previously corrected CSS styles remain here) ... */
    * { box-sizing: border-box; }
    /* Global/Body Styles */
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #070707; /* Dark background */
        margin: 0;
        padding: 40px 0;
        color: #ffffff; /* Default text color for body */
        overflow-x: hidden;
    }

    /* Profile Container */
    .profile-container {
        width: 100%;
        max-width: 650px;
        margin: 0 auto;
        background: #1a1a1a; /* Darker container background */
        padding: 30px 40px;
        border: 1px solid #363636; /* Darker border */
        border-radius: 10px;
    }

    /* Profile Header */
    .profile-header {
        display: flex;
        align-items: center;
        margin-bottom: 30px;
        justify-content: flex-start; 
    }

    .profile-header img {
        width: 90px; /* Slightly larger image */
        height: 90px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #666666; /* Visible border around picture */
    }

    .profile-header-info {
        margin-left: 25px;
        color: #ffffff; 
    }

    .profile-header-info h3 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        color: #f0f0f0; /* Light text for username */
    }

    /* Change Photo Button - REMOVED the old one as it was unused */
    .change-photo-btn {
        display: none;
    }

    /* Form Group Spacing */
    .form-group {
        margin-bottom: 25px;
    }

    /* Label Styling */
    label {
        display: block;
        font-size: 14px; /* Slightly larger font */
        font-weight: 600;
        color: #cccccc; /* Light gray for labels */
        margin-bottom: 8px;
    }

    /* Input and Textarea Styling */
    .profile-form input,
    .profile-form textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #363636; /* Darker border */
        background: #262626; /* Dark input background */
        color: #ffffff; /* White text for input/textarea */
        border-radius: 6px;
        font-size: 15px; /* Slightly larger font */
        box-sizing: border-box; /* Ensures padding is inside width */
    }
    
    /* Ensure Django form fields (widgets) are styled correctly */
    .profile-form .form-group input,
    .profile-form .form-group textarea {
        box-sizing: border-box;
    }

    /* Submit Button */
    .submit-btn {
        width: 100%;
        padding: 12px;
        background: #0095f6; /* Instagram blue */
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
        font-size: 16px; /* Slightly larger font */
        transition: background 0.2s;
    }

    .submit-btn:hover {
        background: #007ac7; /* Darker blue on hover */
    }

    /* Cancel Link */
    .cancel-btn {
        display: block;
        text-align: center;
        color: #0095f6;
        text-decoration: none;
        font-size: 15px;
        margin-top: 14px;
        transition: color 0.2s;
    }

    .cancel-btn:hover {
        color: #5bc0ff;
    }


    /* --- Profile Picture Upload Custom Button Styles --- */

    /* 1. Original input is hidden */
    .picture-small {
        opacity: 0; 
        width: 0.1px;
        height: 0.1px;
        position: absolute;
        z-index: -1;
    }

    /* 2. Custom Upload Button (Label) */
    .upload-button-small {
        display: inline-flex; 
        align-items: center;
        justify-content: center;
        gap: 8px; 
        cursor: pointer;
        padding: 8px 18px; 
        font-size: 1em; 
        border-radius: 6px; 
        width: auto; 
        background: #0095f6; 
        color: white;
        font-weight: 600;
        box-shadow: none; 
        transition: all 0.2s ease;
    }
    
    /* Small Upload Box Styling - Now inside the form */
    .small-upload-box {
        margin-bottom: 25px; 
        /* Removed flex properties here as it's a standard form group now */
    }
    
    /* Fix the button being too small on its own line */
    .small-upload-box label {
        display: inline-block; /* Allow it to wrap the custom button */
        margin-top: 8px; /* Space below the profile picture label */
    }
    
    /* 3. Hover effect */
    .upload-button-small:hover {
        background: #007ac7; 
        transform: none; 
        box-shadow: none;
    }

    /* 4. Valid state (not strictly needed without JS text change) */
    .picture-small:valid + .upload-button-small {
        background: #0095f6; 
    }

    /* Small screen adjustments for better mobile experience */
    @media (max-width: 700px) {
        .profile-container {
            padding: 20px;
        }
        .profile-header {
            flex-direction: column;
            text-align: center;
        }
        .profile-header-info {
            margin-left: 0;
            margin-top: 15px;
        }
        .small-upload-box {
            display: flex;
            justify-content: center; /* Center button on small screens */
            width: 100%;
        }
    }
    
</style>
<div class="profile-container">
    <div class="profile-header">
        <img id="profile-picture" src="{{ profile.profile_picture.url }}" alt="Profile picture">

        <div class="profile-header-info">
            <h3>{{ user.username }}</h3>
        </div>
    </div>

    <form action="" method="post" enctype="multipart/form-data" class="profile-form">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_username">Username</label>
            {{ form.username }}
        </div>

        <div class="form-group">
            <label for="id_bio">Bio</label>
            {{ form.bio }}
        </div>
        
        <div class="small-upload-box">  
            
            <input type="file" name="profile_picture" id="small_profile_pic" accept="image/*" class="picture-small">
            
            <label for="small_profile_pic" class="upload-button-small">
                 Rasm Yuklash
            </label>
        </div>
        <div class="form-group">
            <label for="id_first_name">First name</label>
            {{ form.first_name }}
        </div>

        <div class="form-group">
            <label for="id_last_name">Last name</label>
            {{ form.last_name }}
        </div>

        <div class="form-group">
            <label for="id_email">Email</label>
            {{ form.email }} 
        </div>

        <button type="submit" class="submit-btn">Save Changes</button>

        <a href="{% url 'users:profile' %}" class="cancel-btn">Cancel</a>
    </form>
    </div>

{% endblock %}
