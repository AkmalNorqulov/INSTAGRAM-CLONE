<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Search UI Clone</title>
    <style>
        /* Umumiy uslublar va fon */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            /* Ekran bo'ylab o'rtaga joylash uchun */
            /* align-items: flex-start; */
            /* padding-top: 20px; */
            height: 100vh;
        }

        /* Asosiy konteyner */
        .search-container {
            width: 100%;
            max-width: 450px;
            background-color: #000;
            padding: 10px 0;
            box-sizing: border-box;
        }

        /* Qidiruv sarlavhasi */
        .header {
            padding: 0 15px 15px;
            font-size: 1.5em;
            font-weight: 700;
            color: #fff;
        }

        /* Qidiruv maydoni qismi (Input va X tugmasi) */
        .search-box-wrapper {
            padding: 0 10px;
            margin-bottom: 20px;
        }

        .search-input-group {
            position: relative;
            background-color: #262626; /* Qidiruv fon rangi */
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 8px 12px;
        }

        /* Qidiruv maydonchasi */
        .search-input {
            width: 100%;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 1em;
            padding: 0;
            outline: none; /* Fokusda ko'k ramkani olib tashlash */
        }

        /* Joy tutuvchi (Placeholder) uslubi */
        .search-input::placeholder {
            color: #8e8e8e;
        }

        /* Tozalash tugmasi (X) */
        .clear-button {
            background: #606060;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            line-height: 18px;
            text-align: center;
            font-size: 0.8em;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
            margin-left: 10px;
            display: none; /* Matn bo'lmasa yashirish */
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .clear-button:hover {
            opacity: 1;
        }

        /* Yaqinda qismi */
        .recent-section {
            padding: 0 15px;
        }

        .recent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .recent-title {
            font-size: 1em;
            font-weight: 600;
        }

        .clear-all-button {
            color: #0095f6; /* Moviy rang */
            font-size: 0.9em;
            cursor: pointer;
            font-weight: 600;
        }

        /* Ro'yxat elementlari */
        .recent-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .recent-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }

        .user-info {
            display: flex;
            align-items: center;
        }

        .profile-pic {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            margin-right: 12px;
            background-color: #363636; /* Rasm uchun joy tutuvchi rang */
            object-fit: cover;
            flex-shrink: 0;
        }

        /* Ba'zi profillarda yopiq profil yoki belgi bo'lishi mumkin */
        .icon-placeholder {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            margin-right: 12px;
            background-color: #363636;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
        }
        .icon-placeholder.magnifying-glass {
            background-color: transparent;
            border: 1px solid #363636;
        }

        .user-names {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .username {
            font-size: 0.9em;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
        }

        .fullname {
            font-size: 0.8em;
            color: #a8a8a8;
        }
        
        .verified-badge {
            margin-left: 5px;
            color: #3897f0; /* Moviy tasdiqlash belgisi */
            font-size: 0.8em;
        }

        /* Ro'yxatdan o'chirish tugmasi */
        .remove-recent-button {
            background: none;
            border: none;
            color: #a8a8a8;
            font-size: 1.2em;
            cursor: pointer;
            padding: 5px;
            margin-left: 10px;
        }
        button {
        display: flex;
        height: 3em;
        width: 100px;
        align-items: center;
        justify-content: center;
        background-color: #eeeeee4b;
        border-radius: 3px;
        letter-spacing: 1px;
        transition: all 0.2s linear;
        cursor: pointer;
        border: none;
        background: #fff;
        position: absolute;
        top: 20px;
        left: 20px;
        
        }

        button > svg {
        margin-right: 5px;
        margin-left: 5px;
        font-size: 20px;
        transition: all 0.4s ease-in;
        }

        button:hover > svg {
        font-size: 1.2em;
        transform: translateX(-5px);
        }

        button:hover {
        box-shadow: 9px 9px 33px #d1d1d1, -9px -9px 33px #ffffff;
        transform: translateY(-2px);
        }
    </style>
</head>
<body>
<a href="{% url 'users:profile' %}">  
 <button style="">
  <svg height="16" width="16" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1024 1024"><path d="M874.690416 495.52477c0 11.2973-9.168824 20.466124-20.466124 20.466124l-604.773963 0 188.083679 188.083679c7.992021 7.992021 7.992021 20.947078 0 28.939099-4.001127 3.990894-9.240455 5.996574-14.46955 5.996574-5.239328 0-10.478655-1.995447-14.479783-5.996574l-223.00912-223.00912c-3.837398-3.837398-5.996574-9.046027-5.996574-14.46955 0-5.433756 2.159176-10.632151 5.996574-14.46955l223.019353-223.029586c7.992021-7.992021 20.957311-7.992021 28.949332 0 7.992021 8.002254 7.992021 20.957311 0 28.949332l-188.073446 188.073446 604.753497 0C865.521592 475.058646 874.690416 484.217237 874.690416 495.52477z"></path></svg> 
Back
</button></a>
<div class="search-container">
    <div class="header">Search</div>

    <div class="search-box-wrapper">
        <div class="search-input-group">
            <form method="GET">
                <input type="text" id="searchInput" name="q" class="search-input" placeholder="Search" value="{{ request.GET.q }}" aria-label="Search">
                <button type="submit" class="clear-button">×</button>
            </form>
        </div>
    </div>
    <div class="recent-section">
        <div class="recent-header">
            <div class="recent-title">Recent</div>
            <div class="clear-all-button">Clear all</div>
        </div>
        <ul class="recent-list">
            {% for user in users %}
            <a href='{% url "users:user_profile" user.username %}'>
                <li class="recent-item">
                <div class="user-info">
                    {% if user.profile_picture %}
                        <img src="{{ user.profile_picture.url }}" alt="{{ user.username }}" class="profile-pic">
                    {% else %}
                        <div class="icon-placeholder">👤</div>
                    {% endif %}
                    <div class="user-names">
                        <div class="username">
                            {{ user.username }}
                        </div>
                        <div class="fullname">{{ user.get_full_name }}</div>
                    </div>
                </div>
                {% comment %} <button class="remove-recent-button">×</button> {% endcomment %}
            </li>
            </a>
            {% endfor %}
        </ul>
    </div>
</div>

</body>
</html>
