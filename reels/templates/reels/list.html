<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Reels - HTML/JS versiyasi</title>
    <!-- Tailwind CSS ulash -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Scrollbarni yashirish */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Yurak urish animatsiyasi */
        @keyframes like-bounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .animate-like {
            animation: like-bounce 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-black text-white h-screen w-full overflow-hidden flex justify-center">

    <!-- Asosiy Telefon Konteyeri -->
    <div class="w-full max-w-md h-full relative bg-black flex flex-col">
        
        <!-- Header (Logo va Camera) -->
        <div class="absolute top-0 left-0 right-0 z-20 flex justify-between items-center p-4 pt-6 bg-gradient-to-b from-black/50 to-transparent">
            <h1 class="text-xl font-bold">Reels</h1>
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </div>

        <!-- Videolar Ro'yxati (Feed) -->
        <div id="reels-container" class="flex-1 overflow-y-scroll snap-y snap-mandatory no-scrollbar scroll-smooth h-full">
            <!-- JavaScript orqali videolar shu yerga qo'shiladi -->
        </div>

    </div>

    <script>
        // 1. Ma'lumotlar (20 ta video)
        const videoSources = [
            "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
            "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
            "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
            "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
            "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4"
        ];

        // 20 ta element yaratish uchun massivni ko'paytiramiz
        const reelsData = Array.from({ length: 20 }, (_, i) => ({
            id: i,
            src: videoSources[i % videoSources.length],
            user: `user_${i + 1}`,
            likes: 100 + i * 5,
            description: `Bu Instagram Reels kloni uchun test video #${i + 1}. HTML, CSS va JS da yozildi. #coding #reels #html`
        }));

        const container = document.getElementById('reels-container');

        // 2. HTML yaratish funksiyasi
        function createReelItem(data) {
            const div = document.createElement('div');
            div.className = "w-full h-full snap-start relative flex-shrink-0 bg-gray-900";
            
            div.innerHTML = `
                <!-- Video -->
                <video class="w-full h-full object-cover" loop playsinline muted>
                    <source src="${data.src}" type="video/mp4">
                </video>

                <!-- Overlay (Bosganda ovozni yoqish/o'chirish) -->
                <div class="absolute inset-0 z-10" onclick="toggleMute(this)"></div>

                <!-- O'ng tomon tugmalar -->
                <div class="absolute bottom-20 right-4 z-20 flex flex-col items-center gap-6">
                    <!-- Like -->
                    <div class="flex flex-col items-center gap-1 cursor-pointer group" onclick="toggleLike(this)">
                        <svg class="w-7 h-7 transition-transform group-active:scale-75" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                        </svg>
                        <span class="text-xs font-medium">${data.likes}</span>
                    </div>
                    
                    <!-- Comment -->
                    <div class="flex flex-col items-center gap-1 cursor-pointer">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                        <span class="text-xs font-medium">45</span>
                    </div>

                    <!-- Share -->
                    <div class="cursor-pointer">
                        <svg class="w-7 h-7 -rotate-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </div>

                    <!-- More -->
                    <div class="cursor-pointer">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z"></path></svg>
                    </div>
                </div>

                <!-- Pastki Ma'lumotlar -->
                <div class="absolute bottom-4 left-4 right-16 z-20">
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-8 h-8 bg-gradient-to-tr from-yellow-400 to-purple-600 rounded-full p-[2px]">
                            <div class="w-full h-full bg-gray-800 rounded-full flex items-center justify-center text-[10px] font-bold">
                                ${data.user[0].toUpperCase()}
                            </div>
                        </div>
                        <span class="font-semibold text-sm hover:underline cursor-pointer">${data.user}</span>
                        <button class="border border-white/50 rounded px-2 py-0.5 text-xs font-medium ml-2">Follow</button>
                    </div>
                    <p class="text-sm mb-2 line-clamp-2">${data.description}</p>
                    <div class="flex items-center gap-2 text-xs opacity-80">
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"></path></svg>
                        <div class="w-32 overflow-hidden whitespace-nowrap">
                            <span>Original Audio - ${data.user}</span>
                        </div>
                    </div>
                </div>
            `;
            return div;
        }

        // 3. Sahifaga joylash
        reelsData.forEach(data => {
            container.appendChild(createReelItem(data));
        });

        // 4. Intersection Observer (Avtomatik O'ynatish Logikasi)
        const observerOptions = {
            root: container,
            threshold: 0.6 // Video kamida 60% ko'ringanda ishga tushadi
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (entry.isIntersecting) {
                    // Ekranda ko'rindi -> O'ynatish
                    video.play().catch(err => console.log("Autoplay blocked"));
                    video.currentTime = 0; // Boshidan boshlash (xohlasangiz olib tashlang)
                } else {
                    // Ekrandan chiqdi -> To'xtatish
                    video.pause();
                }
            });
        }, observerOptions);

        // Hamma videolarni kuzatuvga olish
        document.querySelectorAll('.snap-start').forEach(item => {
            observer.observe(item);
        });

        // 5. Qo'shimcha Funksiyalar
        
        // Ovozni yoqish/o'chirish
        function toggleMute(overlay) {
            const video = overlay.previousElementSibling;
            video.muted = !video.muted;
            
            // Kichik vizual effekt (ixtiyoriy)
            // Agar ovoz yoqilsa, foydalanuvchiga bildirish mumkin
        }

        // Like bosish
        function toggleLike(btn) {
            const svg = btn.querySelector('svg');
            
            if (svg.classList.contains('text-red-500')) {
                // Dislike
                svg.classList.remove('text-red-500', 'fill-red-500');
                svg.classList.add('text-white');
            } else {
                // Like
                svg.classList.remove('text-white');
                svg.classList.add('text-red-500', 'fill-red-500', 'animate-like');
                
                // Animatsiyani qayta ishlatish uchun tozalash
                setTimeout(() => {
                    svg.classList.remove('animate-like');
                }, 300);
            }
        }
    </script>
</body>
</html>
